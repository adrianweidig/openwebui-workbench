    <text x="104" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#164e63">Portable Modellpakete, Tools, Filter und Air-Gap-Handover</text>
    <text x="104" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155">Python-Validierung  •  OpenWebUI-Import  •  Offline-Workflows</text>
