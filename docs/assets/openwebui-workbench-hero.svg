<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenWebUI Workbench</title>
  <desc id="desc">A calm repository hero showing model packages, tools, filters and deployment artifacts flowing into OpenWebUI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#123f4d"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ecfeff" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <path d="M0 310 C160 260 270 350 420 306 C560 265 690 202 850 248 C990 288 1120 214 1280 245 L1280 420 L0 420 Z" fill="#f8fafc" opacity="0.88"/>
