name: Docker Workbench Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - Deployment/Dockerfile.workbench
      - Deployment/workbench-entrypoint.sh
      - Workbench/**
      - .github/workflows/docker-workbench-dashboard.yml
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Deployment/Dockerfile.workbench
      - Deployment/workbench-entrypoint.sh
      - Workbench/**
      - .github/workflows/docker-workbench-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Workbench dashboard image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/workbench-dashboard" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Deployment/Dockerfile.workbench
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
