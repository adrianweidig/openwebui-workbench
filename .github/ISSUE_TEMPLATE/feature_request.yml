name: Feature request / Funktionsvorschlag
description: Neues Modell, Tool, Skill, Übersetzung, Validierung oder Dokumentationsverbesserung vorschlagen.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Neues Modell
        - Tool
        - Filter
        - Skill
        - Import/Export
        - Deployment
        - Internationalisierung/Localization
        - Tests/CI
        - Dokumentation
        - Repository-Pflege
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Bedarf
      description: Welches konkrete Problem soll gelöst werden? / Which concrete problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      description: Wie könnte die Lösung aussehen? / What could the solution look like?
    validations:
      required: true
  - type: textarea
    id: offline
    attributes:
      label: Offline- und Sicherheitsauswirkungen
      description: Betrifft der Vorschlag Netzwerkzugriff, Valves, Jupyter, Dateisystem-Mounts, Sprache/Locale oder Secrets?
  - type: textarea
    id: validation
    attributes:
      label: Mögliche Validierung
      description: Welche Checks sollten den Beitrag absichern? / Which checks should validate the contribution?
