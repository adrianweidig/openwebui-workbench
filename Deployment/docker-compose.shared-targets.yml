name: openwebui-workbench-shared

services:
  # Workbench dashboard for a shared OpenWebUI/RAGFlow/Seafile runtime.
  #
  # This compose file intentionally does not create OpenWebUI, RAGFlow or
  # Seafile. It joins the existing shared Docker network and addresses the
  # already running target containers through Docker DNS.
  workbench:
    build:
      context: ..
      dockerfile: Deployment/Dockerfile.workbench
    image: ${WORKBENCH_IMAGE:-openwebui-workbench-dashboard:local}
    container_name: ${WORKBENCH_CONTAINER_NAME:-openwebui-workbench}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8088}:8088"
    environment:
      WORKBENCH_ROOT: /workspace
      WORKBENCH_HOST: 0.0.0.0
      WORKBENCH_PORT: 8088
      WORKBENCH_ALLOW_WRITE: ${WORKBENCH_ALLOW_WRITE:-true}
      WORKBENCH_COMMAND_TIMEOUT_SECONDS: ${WORKBENCH_COMMAND_TIMEOUT_SECONDS:-300}
      WORKBENCH_AUTOMATION_ENABLED: ${WORKBENCH_AUTOMATION_ENABLED:-true}
      WORKBENCH_AUTOMATION_INTERVAL_MINUTES: ${WORKBENCH_AUTOMATION_INTERVAL_MINUTES:-30}
      WORKBENCH_AUTOMATION_ACTIONS: ${WORKBENCH_AUTOMATION_ACTIONS:-check}
      WORKBENCH_AUTOMATION_RUN_ON_START: ${WORKBENCH_AUTOMATION_RUN_ON_START:-false}
      WORKBENCH_LOCALE: ${WORKBENCH_LOCALE:-de}
      WORKBENCH_REQUIRE_AUTH: ${WORKBENCH_REQUIRE_AUTH:-true}
      WORKBENCH_AUTH_USERNAME: ${WORKBENCH_AUTH_USERNAME:-workbench}
      WORKBENCH_AUTH_PASSWORD: ${WORKBENCH_AUTH_PASSWORD:-}
      WORKBENCH_AUTH_PASSWORD_FILE: ${WORKBENCH_AUTH_PASSWORD_FILE:-}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-http://openwebui:8080}
      OPENWEBUI_PUBLIC_URL: ${OPENWEBUI_PUBLIC_URL:?Set OPENWEBUI_PUBLIC_URL to the browser URL of the shared OpenWebUI target}
      OPENWEBUI_TLS_VERIFY: ${OPENWEBUI_TLS_VERIFY:-true}
      OPENWEBUI_CA_FILE: ${OPENWEBUI_CA_FILE:-}
      OPENWEBUI_CA_PATH: ${OPENWEBUI_CA_PATH:-}
      OPENWEBUI_ADMIN_TOKEN: ${OPENWEBUI_ADMIN_TOKEN:-}
      OPENWEBUI_ADMIN_TOKEN_FILE: ${OPENWEBUI_ADMIN_TOKEN_FILE:-}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow}
      SEAFILE_BASE_URL: ${SEAFILE_BASE_URL:-http://seafile}
      PORTAINER_URL: ${PORTAINER_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ..:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      shared-targets:
        aliases:
          - workbench
          - openwebui-workbench

networks:
  shared-targets:
    external: true
    name: ${WORKBENCH_SHARED_DOCKER_NETWORK:-ki_infra_seu_test}
