name: openwebui-workbench

services:
  # Optional password-file mount for local Docker Compose.
  #
  # Use this file only together with docker-compose.workbench.yml when the
  # dashboard password should come from a host-side secret file instead of a
  # direct WORKBENCH_AUTH_PASSWORD value in .env.
  workbench:
    environment:
      WORKBENCH_REQUIRE_AUTH: ${WORKBENCH_REQUIRE_AUTH:-true}
      WORKBENCH_AUTH_PASSWORD: ""
      WORKBENCH_AUTH_PASSWORD_FILE: ${WORKBENCH_AUTH_PASSWORD_FILE:?Set WORKBENCH_AUTH_PASSWORD_FILE to the Workbench container target path}
    volumes:
      - type: bind
        source: ${WORKBENCH_AUTH_PASSWORD_HOST_FILE:?Set WORKBENCH_AUTH_PASSWORD_HOST_FILE to the host password file}
        target: ${WORKBENCH_AUTH_PASSWORD_FILE:?Set WORKBENCH_AUTH_PASSWORD_FILE to the Workbench container target path}
        read_only: true
