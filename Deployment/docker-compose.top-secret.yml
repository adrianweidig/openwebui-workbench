services:
  # Optional local edge-proxy attachment
  #
  # Use this file only together with docker-compose.workbench.yml when an
  # external top.secret edge network already exists. It does not create or
  # configure the proxy; it only gives the workbench container stable aliases
  # that an existing proxy can route to.
  workbench:
    networks:
      top-secret-edge:
        aliases:
          - workbench
          - workbench.top.secret

networks:
  # Default matches the local KI-Infra-SEU test edge network.
  # Override TOPSECRET_EDGE_NETWORK in .env if your proxy network has another name.
  top-secret-edge:
    external: true
    name: ${TOPSECRET_EDGE_NETWORK:-ki_infra_seu_test}
