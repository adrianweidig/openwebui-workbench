services:
  openwebui:
    image: open-webui:offline-cuda
    container_name: openwebui-offline
    restart: unless-stopped
    command: ["bash", "/app/backend/start-offline.sh"]
    ports:
      - "3000:8080"
    env_file:
      - ./openwebui.env
    volumes:
      - openwebui-data:/app/backend/data
      - "E:\\openwebui-workbench\\Modelle\\dist:/app/backend/data/openwebui-import:ro"
      - "E:\\openwebui-workbench\\Tools:/app/backend/data/openwebui-tools:ro"
      - "E:\\openwebui-workbench\\Artefakte\\output:/app/backend/data/offline_artifacts"
      - "F:\\offline-ai-stack\\openwebui-offline-addons\\cache:/app/backend/data/cache"
      - "F:\\offline-ai-stack\\openwebui-offline-addons\\nltk_data:/app/backend/data/nltk_data"
      - "F:\\offline-ai-stack\\openwebui-offline-addons\\python:/app/backend/data/python"
      - "F:\\offline-ai-stack\\openwebui-offline-addons\\python\\openwebui_offline_addons.pth:/usr/local/lib/python3.11/site-packages/openwebui_offline_addons.pth:ro"
      - "F:\\offline-ai-stack\\openwebui-offline-addons\\bin\\start-offline.sh:/app/backend/start-offline.sh:ro"
    networks:
      - offline-ai

  jupyter:
    image: local-jupyter:offline
    container_name: openwebui-jupyter
    restart: unless-stopped
    command: ["jupyter", "server", "--ip=0.0.0.0", "--no-browser", "--ServerApp.token=${OPENWEBUI_JUPYTER_TOKEN}"]
    volumes:
      - "E:\\openwebui-workbench\\Artefakte\\output:/workspace/artifacts"
    networks:
      - offline-ai

volumes:
  openwebui-data:

networks:
  offline-ai:
    driver: bridge
