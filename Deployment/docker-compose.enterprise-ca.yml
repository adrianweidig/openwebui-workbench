name: openwebui-workbench

services:
  openwebui:
    environment:
      SSL_CERT_FILE: ${OPENWEBUI_SSL_CERT_FILE:-/certs/company-root-ca.pem}
      REQUESTS_CA_BUNDLE: ${OPENWEBUI_REQUESTS_CA_BUNDLE:-/certs/company-root-ca.pem}
      CURL_CA_BUNDLE: ${OPENWEBUI_CURL_CA_BUNDLE:-/certs/company-root-ca.pem}
      NODE_EXTRA_CA_CERTS: ${OPENWEBUI_NODE_EXTRA_CA_CERTS:-/certs/company-root-ca.pem}
    volumes:
      - type: bind
        source: ${WORKBENCH_ENTERPRISE_CA_HOST_FILE:?Set WORKBENCH_ENTERPRISE_CA_HOST_FILE to your root CA PEM file}
        target: /certs/company-root-ca.pem
        read_only: true

  workbench:
    environment:
      WORKBENCH_CA_BUNDLE: ${WORKBENCH_CA_BUNDLE:-/certs/company-root-ca.pem}
      WORKBENCH_SYSTEM_CA_BUNDLE: ${WORKBENCH_SYSTEM_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
      OPENWEBUI_TLS_VERIFY: ${OPENWEBUI_TLS_VERIFY:-true}
      OPENWEBUI_CA_FILE: ${OPENWEBUI_CA_FILE:-/certs/company-root-ca.pem}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
    volumes:
      - type: bind
        source: ${WORKBENCH_ENTERPRISE_CA_HOST_FILE:?Set WORKBENCH_ENTERPRISE_CA_HOST_FILE to your root CA PEM file}
        target: /certs/company-root-ca.pem
        read_only: true
