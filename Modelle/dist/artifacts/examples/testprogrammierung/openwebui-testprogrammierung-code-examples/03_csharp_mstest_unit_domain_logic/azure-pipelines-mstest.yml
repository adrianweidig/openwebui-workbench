trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testProject: tests/DiscountEngine.Tests/DiscountEngine.Tests.csproj

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 8.x

  - script: dotnet restore $(testProject)
    displayName: Restore dependencies

  - script: dotnet build $(testProject) --configuration $(buildConfiguration) --no-restore
    displayName: Build unit tests

  - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults --collect "XPlat Code Coverage"
    displayName: Run MSTest unit tests

  - task: PublishTestResults@2
    displayName: Publish TRX test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Agent.TempDirectory)/TestResults/*.trx
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Publish coverage output
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Agent.TempDirectory)/TestResults
      artifact: mstest-results
      publishLocation: pipeline
