trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testProject: src/CheckoutAcceptance.Playwright.Tests/CheckoutAcceptance.Playwright.Tests.csproj

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 8.x

  - script: dotnet restore $(testProject)
    displayName: Restore dependencies

  - script: dotnet build $(testProject) --configuration $(buildConfiguration) --no-restore
    displayName: Build checkout acceptance tests

  - script: pwsh src/CheckoutAcceptance.Playwright.Tests/bin/$(buildConfiguration)/net8.0/playwright.ps1 install --with-deps
    displayName: Install Playwright browsers

  - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Run checkout acceptance tests
    env:
      APP_BASE_URL: $(appBaseUrl)
      CHECKOUT_PRODUCT_SKU: $(checkoutProductSku)
      EXPIRED_VOUCHER_CODE: $(expiredVoucherCode)

  - task: PublishTestResults@2
    displayName: Publish TRX test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Agent.TempDirectory)/TestResults/*.trx
      failTaskOnFailedTests: true
