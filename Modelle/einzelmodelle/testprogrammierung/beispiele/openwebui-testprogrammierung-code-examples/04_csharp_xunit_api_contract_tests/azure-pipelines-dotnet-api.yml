trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testProject: src/ApiContract.Xunit.Tests/ApiContract.Xunit.Tests.csproj
  API_BASE_URL: $(apiBaseUrl)

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 8.x

  - script: dotnet restore $(testProject)
    displayName: Restore dependencies

  - script: dotnet build $(testProject) --configuration $(buildConfiguration) --no-restore
    displayName: Build API tests

  - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/TestResults
    displayName: Run API contract tests
    env:
      API_BASE_URL: $(API_BASE_URL)
      API_BEARER_TOKEN: $(apiBearerToken)

  - task: PublishTestResults@2
    displayName: Publish TRX test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Agent.TempDirectory)/TestResults/*.trx
      failTaskOnFailedTests: true
